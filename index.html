<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f1ecf4">
  <meta name="description" content="روابط LAYORA الرسمية">
  <title>LAYORA</title>
  <style>
    :root{--lilac:#f1ecf4;--purple:#7e6a89;--deep:#4f405a;--muted:#786b7d}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:var(--lilac)}
    body{color:var(--deep);font-family:Tahoma,Arial,sans-serif}
    .page{position:relative;display:grid;min-height:100svh;place-items:center;overflow:hidden;padding:30px 18px 24px;background:radial-gradient(circle at 50% -10%,rgba(255,255,255,.48),transparent 45%),var(--lilac);isolation:isolate}
    .page:before{position:absolute;inset:0;z-index:-2;background-image:radial-gradient(rgba(126,106,137,.24) .65px,transparent .65px);background-size:9px 9px;mask-image:linear-gradient(to bottom,#000,transparent 80%);content:""}
    .ring{position:absolute;z-index:-1;width:390px;height:390px;border:1px solid rgba(126,106,137,.15);border-radius:50%}
    .ring.one{top:-230px;right:-140px}.ring.two{bottom:-260px;left:-190px}
    .content{width:min(100%,470px)}
    header{text-align:center;margin-bottom:18px}
    .logo{display:block;width:190px;height:auto;margin:auto}
    h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    .orbit{position:relative;width:min(100%,450px);aspect-ratio:1;margin:auto;border:1px solid rgba(126,106,137,.14);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.42) 0 21%,rgba(126,106,137,.035) 22% 57%,transparent 58%);box-shadow:inset 0 0 55px rgba(126,106,137,.04)}
    .orbit:before,.orbit:after{position:absolute;inset:12%;border:1px dashed rgba(126,106,137,.13);border-radius:50%;content:""}
    .orbit:after{inset:31%;border-style:solid;background:rgba(126,106,137,.035)}
    a{color:inherit;text-decoration:none}
    .link{position:absolute;z-index:2;display:flex;width:116px;min-height:116px;flex-direction:column;align-items:center;justify-content:center;padding:12px 8px 10px;border:1px solid rgba(126,106,137,.2);border-radius:50%;background:rgba(241,236,244,.95);box-shadow:inset 0 1px rgba(255,255,255,.32),0 14px 30px rgba(85,68,94,.1);transition:.18s ease}
    .link:hover,.link:focus-visible{border-color:rgba(126,106,137,.5);outline:none;background:#f7f3f8;box-shadow:0 17px 36px rgba(85,68,94,.15)}
    .map{top:50%;left:50%;z-index:4;width:142px;min-height:142px;border-width:2px;transform:translate(-50%,-50%)}
    .top{top:0;left:50%;transform:translateX(-50%)}.right{top:50%;right:0;transform:translateY(-50%)}.bottom{bottom:0;left:50%;transform:translateX(-50%)}.left{top:50%;left:0;transform:translateY(-50%)}
    .map:hover,.map:focus-visible{transform:translate(-50%,-50%) scale(1.04)}.top:hover,.top:focus-visible,.bottom:hover,.bottom:focus-visible{transform:translateX(-50%) scale(1.04)}.right:hover,.right:focus-visible,.left:hover,.left:focus-visible{transform:translateY(-50%) scale(1.04)}
    .icon{display:grid;width:64px;height:64px;place-items:center;color:var(--lilac);border-radius:21px;background:var(--purple);box-shadow:0 11px 24px rgba(78,62,88,.2)}
    .map .icon{width:70px;height:70px;border-radius:50%}.icon svg{width:31px;height:31px;fill:currentColor}
    strong{margin-top:10px;font-size:13px}small{margin-top:3px;color:var(--muted);font-size:9px}
    footer{text-align:center;margin-top:28px;color:var(--muted);font-size:10px}footer p{margin:5px}footer span{letter-spacing:.12em;opacity:.74}
    @media(max-width:380px){.page{padding:22px 14px 18px}.logo{width:170px}.orbit{width:min(100%,350px)}.link{width:94px;min-height:94px;padding:8px 5px}.map{width:116px;min-height:116px}.icon{width:52px;height:52px;border-radius:18px}.map .icon{width:60px;height:60px}strong{margin-top:7px;font-size:11px}small{font-size:8px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>

      </nav>
      <footer><p>كل ما يخص LAYORA في مكان واحد</p><span dir="ltr">© 2026 LAYORA</span></footer>
    </section>
  </main>
</body>
